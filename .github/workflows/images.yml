# Builds the three images and publishes them to GitHub's container registry.
#   push to main   -> tag :main   (bleeding edge)
#   push to stable -> tag :stable (what installs follow by default)
# Watchtower on each install pulls the new tag on its schedule.
name: images
on:
  push:
    branches: [main, stable]
    paths: [web/**, caddy/**, helper/**, provision/**, .github/workflows/images.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: caddy/Dockerfile
          - name: helper
            dockerfile: helper/Dockerfile
          - name: provision
            dockerfile: provision/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
