# Overlay: NVIDIA GPU transcoding for Jellyfin.
# Enable by setting in .env:  COMPOSE_FILE=docker-compose.yml:docker-compose.nvidia.yml
services:
  jellyfin:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
